apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cogni-candidate-a

resources:
  - ../../../base/scheduler-worker

images:
  - name: ghcr.io/cogni-dao/cogni-template
    newName: ghcr.io/cogni-dao/cogni-template
    digest: "sha256:51ffa27cad1f2436c2955f81b6b35e56a4e0363bd9c0d55efddef53618d7918c"

patches:
  - target:
      kind: ConfigMap
      name: scheduler-worker-config
    patch: |
      - op: replace
        path: /data/TEMPORAL_NAMESPACE
        value: "cogni-candidate-a"
      - op: replace
        path: /data/IMAGE_DIGEST
        value: "sha256:51ffa27cad1f2436c2955f81b6b35e56a4e0363bd9c0d55efddef53618d7918c"
      - op: add
        path: /data/GIT_SHA
        value: "68ce1010cc4cfbe241d28b0a4a7b4bac71920050"

  # bug.0295: VM discovery via DNS (cogni-candidate-a.vm.cognidao.org).
  # Convert base headless Services → ExternalName; delete EndpointSlices.
  - target: { kind: Service, name: temporal }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: temporal
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: postgres }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: app }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: app
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: poly-app }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: poly-app
  - target: { kind: Service, name: resy-app }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: resy-app
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: EndpointSlice, name: temporal-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: temporal-1
  - target: { kind: EndpointSlice, name: postgres-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: postgres-1
  - target: { kind: EndpointSlice, name: app-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: app-1
  - target: { kind: EndpointSlice, name: poly-app-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: poly-app-1
  - target: { kind: EndpointSlice, name: resy-app-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: resy-app-1
