apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cogni-candidate-a
resources:
  - ../../../base/scheduler-worker
images:
  - name: ghcr.io/cogni-dao/cogni-template
    newName: ghcr.io/cogni-dao/cogni-template
    digest: "sha256:9af6f5ca521c8d5191c0bb59983020fe4a23820d3b86506fb7bed7834d8d3c22"
patches:
  - target:
      kind: ConfigMap
      name: scheduler-worker-config
    patch: |
      - op: replace
        path: /data/TEMPORAL_NAMESPACE
        value: "cogni-candidate-a"
      - op: replace
        path: /data/IMAGE_DIGEST
        value: "sha256:9af6f5ca521c8d5191c0bb59983020fe4a23820d3b86506fb7bed7834d8d3c22"
      - op: add
        path: /data/GIT_SHA
        value: "a049c34d6f6f69273d1f7365b1909d9881088831"
  # bug.0295: VM discovery via DNS (cogni-candidate-a.vm.cognidao.org).
  # Convert base headless Services → ExternalName; delete EndpointSlices.
  - target: {kind: Service, name: temporal}
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: temporal
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: {kind: Service, name: postgres}
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: {kind: Service, name: app}
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: app
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: {kind: Service, name: poly-app}
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: poly-app
  - target: {kind: Service, name: resy-app}
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: resy-app
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: {kind: EndpointSlice, name: temporal-1}
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: temporal-1
  - target: {kind: EndpointSlice, name: postgres-1}
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: postgres-1
  - target: {kind: EndpointSlice, name: app-1}
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: app-1
  - target: {kind: EndpointSlice, name: poly-app-1}
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: poly-app-1
  - target: {kind: EndpointSlice, name: resy-app-1}
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: resy-app-1
  - path: node-endpoints.patch.yaml
  - path: serial-rollout.patch.yaml
  - path: replicas.patch.yaml
  - path: config-checksum.patch.yaml
