apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cogni-candidate-a
resources:
  - ../../../base/scheduler-worker
images:
  - name: ghcr.io/cogni-dao/cogni-template
    newName: ghcr.io/cogni-dao/cogni-template
    digest: "sha256:b073bc93a8530775a14e1329e720ac6ba041956e169dc06afdd51bb6aa46096f"
patches:
  - target:
      kind: ConfigMap
      name: scheduler-worker-config
    patch: |
      - op: replace
        path: /data/TEMPORAL_NAMESPACE
        value: "cogni-candidate-a"
      - op: replace
        path: /data/IMAGE_DIGEST
        value: "sha256:b073bc93a8530775a14e1329e720ac6ba041956e169dc06afdd51bb6aa46096f"
      - op: add
        path: /data/GIT_SHA
        value: "3b4efb13616b0b1a1588a5442f511c2f4f94f714"
  # bug.0295: VM discovery via DNS (cogni-candidate-a.vm.cognidao.org).
  # Convert base headless Services → ExternalName; delete EndpointSlices.
  - target: {kind: Service, name: temporal}
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: temporal
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: {kind: Service, name: postgres}
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: {kind: Service, name: app}
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: app
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: {kind: Service, name: poly-app}
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: poly-app
  - target: {kind: Service, name: resy-app}
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: resy-app
      spec:
        type: ExternalName
        externalName: cogni-candidate-a.vm.cognidao.org
        clusterIP: null
  - target: {kind: EndpointSlice, name: temporal-1}
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: temporal-1
  - target: {kind: EndpointSlice, name: postgres-1}
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: postgres-1
  - target: {kind: EndpointSlice, name: app-1}
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: app-1
  - target: {kind: EndpointSlice, name: poly-app-1}
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: poly-app-1
  - target: {kind: EndpointSlice, name: resy-app-1}
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: resy-app-1
  - path: node-endpoints.patch.yaml
  - path: replicas.patch.yaml
  - path: serial-rollout.patch.yaml
  - path: config-checksum.patch.yaml
replicas:
  - name: scheduler-worker
    count: 1
