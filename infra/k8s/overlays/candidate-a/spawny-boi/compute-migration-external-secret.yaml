apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spawny-boi-compute-migration-secrets
  namespace: cogni-candidate-a
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: spawny-boi-compute-migration-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: DATABASE_MIGRATION_URL
      remoteRef:
        key: candidate-a/spawny-boi-database-migration
        property: DATABASE_MIGRATION_URL
    - secretKey: DATABASE_SSL_CA_CERT
      remoteRef:
        key: candidate-a/spawny-boi-database-migration
        property: DATABASE_SSL_CA_CERT
    - secretKey: DOLTGRES_URL
      remoteRef:
        key: candidate-a/spawny-boi
        property: DOLTGRES_URL
