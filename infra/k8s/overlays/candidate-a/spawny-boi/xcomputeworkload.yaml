apiVersion: compute.cogni.io/v1alpha1
kind: XComputeWorkload
metadata:
  name: d520f82e-486a-40f1-9e4f-c8ef7a016e9a
  namespace: cogni-candidate-a
  labels:
    cogni.io/node-id: d520f82e-486a-40f1-9e4f-c8ef7a016e9a
    cogni.io/environment: candidate-a
    cogni.io/node: spawny-boi
spec:
  nodeId: d520f82e-486a-40f1-9e4f-c8ef7a016e9a
  environment: candidate-a
  bundle:
    ref: ghcr.io/cogni-test-org/spawny-boi@sha256:7f8f5f86d4b74cf2edb5a5efe0f1f032cc3aeb73ab24339e6a3c0db9e42f4687
    source:
      repository: cogni-test-org/spawny-boi
      sha: 662d748423b9698ed77adb41f93103a2c79b2fa6
    artifacts:
      - name: app
        image: ghcr.io/cogni-test-org/spawny-boi@sha256:aef638d87df753c3c4186ae85547fba85ae779503452ede4ed2f723bf367c608
  workload:
    name: spawny-boi
    publicHost: spawny-boi.cogni-testing.org
    services:
      - name: app
        artifact: app
        runtimeProfile: cogni-node-app-v1
        secretRefs:
          - key: AUTH_SECRET
          - key: DATABASE_URL
          - key: DATABASE_SERVICE_URL
          - key: DATABASE_SSL_CA_CERT
          - key: DOLTGRES_URL
          - key: EVM_RPC_URL
          - key: LITELLM_VIRTUAL_KEY
          - key: SCHEDULER_API_TOKEN
          - key: BILLING_INGEST_TOKEN
        command:
          - /bin/sh
          - -ec
          - |-
            set -eu
            if [ -n "${DATABASE_SSL_CA_CERT:-}" ]; then
              umask 077
              cogni_db_ca_file=$(mktemp /tmp/cogni-database-ca.XXXXXX)
              printf "%s\n" "$DATABASE_SSL_CA_CERT" > "$cogni_db_ca_file"
              export NODE_EXTRA_CA_CERTS="$cogni_db_ca_file"
              export PGSSLROOTCERT="$cogni_db_ca_file"
            fi
            exec "$@"
          - cogni-database-trust
        args:
          - node
          - app/server.js
        port: 3200
        visibility: public
        bindings: {}
        bindHost: 0.0.0.0
        cpuUnits: 2
        memoryMi: 2048
        storageMi: 4096
  migration:
    policy: RequireBeforeServing
  bootPolicy:
    onDeadline: Close
    onGiveUp: Hold
  leaseGeneration: 5
  actuatorNamespace: cogni-candidate-a
  dns:
    provider: cloudflare
    zoneId: 23220356c352c5831c6af57887b11a27
  runtime:
    substrateHost: cogni-candidate-a.vm.cognidao.org
